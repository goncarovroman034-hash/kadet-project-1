            border: 2px solid #ff4444;
        }
        .photo-gallery {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .photo-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .photo-item img {

            border-radius: 8px;
            border: 2px solid #b30000;
        }
        .photo-caption {
            margin-top: 8px;
            font-size: 14px;
            color: #ccc;
        }
        .back-btn {
            display: block;
            width: 200px;
            margin: 30px auto 0;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #555;
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 16px;
            cursor: pointer;

                return;
            }
            document.getElementById('graduateName').innerHTML = graduate.name;
            const gallery = document.getElementById('photoGallery');
            gallery.innerHTML = graduate.photos.map(photo => `
                <div class="photo-item">
                    <img src="${photo.src}" alt="${photo.caption}">
                    <div class="photo-caption">${photo.caption}</div>
                </div>
            `).join('');
