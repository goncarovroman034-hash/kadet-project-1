<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кадет - Выпуск 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(179, 0, 0, 0.9);
            border-radius: 15px;
            border: 2px solid #ff4444;
        }
        .photo-gallery {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .photo-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .photo-item img {
            width: 100%;
            border-radius: 8px;
            border: 2px solid #b30000;
        }
        .photo-caption {
            margin-top: 8px;
            font-size: 14px;
            color: #ccc;
        }
        .back-btn {
            display: block;
            width: 200px;
            margin: 30px auto 0;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #555;
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="graduateName">Кадет</h1>
        <p>Выпуск 2026 года</p>
    </div>

    <div class="photo-gallery" id="photoGallery"></div>

    <button class="back-btn" onclick="goBack()">← Назад к списку</button>

    <script>
        const graduatesData = {
            1: {
                name: "Борышев Максим Юрьевич",
                photos: [
                    { src: "../photos/graduate2026-1-1.jpg", caption: "Первый раз-в 5 кадетский класс!" },
                    { src: "../photos/graduate2026-1-2.jpg", caption: "Вручение аттестата" }
                ]
            },
            2: {
                name: "Глазьев Александр Александрович",
                photos: [
                    { src: "../photos/graduate2026-2-1.jpg", caption: "Первый раз-в 5 кадетский класс!" },
                    { src: "../photos/graduate2026-2-2.jpg", caption: "Вручение аттестата" }
                ]
            },
            3: {
                name: "Дорошкевич Егор Константинович",
                photos: [
                    { src: "../photos/graduate2026-3-1.jpg", caption: "Первый раз-в 5 кадетский класс!" },
                    { src: "../photos/graduate2026-3-2.jpg", caption: "Вручение аттестата" }
                ]
            },
             4: {
                name: "Кудряшов Глеб Сергеевич",
                photos: [
                    { src: "../photos/graduate2026-4-1.jpg", caption: "Первый раз-в 5 кадетский класс!" },
                    { src: "../photos/graduate2026-4-2.jpg", caption: "Вручение аттестата" }
                ]
            },
            5: {
                name: "Кузнецов Глеб Юрьевич",
                photos: [
                    { src: "../photos/graduate2026-5-1.jpg", caption: "Первый раз-в 5 кадетский класс!" },
                    { src: "../photos/graduate2026-5-2.jpg", caption: "Вручение аттестата" }
                ]
            },
            6: {
                name: "Лопатин Андрей Сергеевич",
                photos: [
                    { src: "../photos/graduate2026-6-1.jpg", caption: "Первый раз-в 5 кадетский класс!" },
                    { src: "../photos/graduate2026-6-2.jpg", caption: "Вручение аттестата" }
                ]
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const graduateId = urlParams.get('id');

        function loadGraduate() {
            const graduate = graduatesData[graduateId];
            if (!graduate) {
                document.getElementById('graduateName').innerHTML = "Кадет не найден";
                return;
            }
            document.getElementById('graduateName').innerHTML = graduate.name;
            const gallery = document.getElementById('photoGallery');
            gallery.innerHTML = graduate.photos.map(photo => `
                <div class="photo-item">
                    <img src="${photo.src}" alt="${photo.caption}">
                    <div class="photo-caption">${photo.caption}</div>
                </div>
            `).join('');
        }

        function goBack() {
            window.location.href = 'graduates-2026.html';
        }

        loadGraduate();
    </script>
</body>
</html>
