<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Руководство - Цифровой код кадетства</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(179, 0, 0, 0.9);
            border-radius: 15px;
            border: 2px solid #ff4444;
        }
        .menu-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(179, 0, 0, 0.5);
            border-radius: 12px;
            padding: 18px 20px;
            margin: 12px 0;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .menu-btn:hover {
            background: rgba(179, 0, 0, 0.3);
            border-color: #ff4444;
            transform: translateY(-2px);
        }
        .btn-icon {
            font-size: 24px;
            margin-right: 15px;
            width: 40px;
            text-align: center;
        }
        .btn-text {
            flex-grow: 1;
            text-align: left;
        }
        .btn-year {
            background: #b30000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .back-btn {
            display: block;
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #555;
            border-radius: 10px;
            padding: 15px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏛️ Руководство</h1>
        <p>Цифровой код кадетства</p>
    </div>

    <div class="menu-container">
        <button class="menu-btn" onclick="showArchive('rukovodstvo-1')">
            <span class="btn-icon">🎖️</span>
            <span class="btn-text">Старший воспитатель-командир учебной роты</span>
            <span class="btn-year">👤</span>
        </button>

        <button class="menu-btn" onclick="showArchive('rukovodstvo-2')">
            <span class="btn-icon">👨‍🏫</span>
            <span class="btn-text">Воспитатели</span>
            <span class="btn-year">👥</span>
        </button>

        <button class="menu-btn" onclick="showArchive('rukovodstvo-3')">
            <span class="btn-icon">🛡️</span>
            <span class="btn-text">Младшие воспитатели</span>
            <span class="btn-year">👥</span>
        </button>

        <button class="menu-btn" onclick="showArchive('rukovodstvo-4')">
            <span class="btn-icon">🎭</span>
            <span class="btn-text">Педагог-организатор</span>
            <span class="btn-year">👤</span>
        </button>
        
        <button class="back-btn" onclick="goBack()">
            ← Назад к выбору объекта
        </button>
    </div>

    <script>
        const archiveData = {
            'rukovodstvo-1': {
                title: 'Старший воспитатель-командир 1 учебной роты',
                year: 'Руководство',
                description: 'Морозов Юрий Анатольевич.',
                shortInfo: '📌 Должность: Старший воспитатель-командир учебной роты\n📌 Стаж: 24 года педагогической деятельности\n📌 Категория: Высшая квалификационная категория',
                bio: 'В военно-космическом кадетском корпусе с 2002 по 2010. С 2011 года по настоящее время - старший воспитатель.',
                images: ['../photos/management-1.jpg']
            },
            'rukovodstvo-2': {
                title: 'Воспитатели',
                year: 'Руководство',
                description: 'Педагогические работники, отвечающие за воспитание и развитие кадетов.',
                images: [
                    { 
                        src: '../photos/management-2.jpg', 
                        shortInfo: 'Карпов Сергей Александрович\n📌 Должность: Воспитатель\n📌 Стаж: с 2003 года\n📌 Категория: Высшая'
                    },
                    { 
                        src: '../photos/management-3.jpg', 
                        shortInfo: 'Нестеров Дмитрий Васильевич\n📌 Должность: Воспитатель\n📌 Стаж: с 2002 года\n📌 Категория: Высшая'
                    },
                    { 
                        src: '../photos/management-4.jpg', 
                        shortInfo: 'Котов Александр Юрьевич\n📌 Должность: Воспитатель\n📌 Стаж: с 2015 года\n📌 Категория: Первая'
                    }
                ]
            },
            'rukovodstvo-3': {
                title: 'Младшие воспитатели',
                year: 'Руководство', 
                description: 'Помощники воспитателей, обеспечивающие повседневный быт и дисциплину.',
                images: [
                    '../photos/rukovodstvo-3-1.jpg',
                    '../photos/rukovodstvo-3-2.jpg'
                ]
            },
            'rukovodstvo-4': {
                title: 'Педагог-организатор',
                year: 'Руководство',
                description: 'Специалист по организации внеурочной деятельности и мероприятий.',
                images: [
                    '../photos/management-5.jpg',
                    '../photos/rukovodstvo-4-2.jpg'
                ]
            }
        };

        function showArchive(archiveId) {
            const data = archiveData[archiveId];
            if (!data) {
                alert('Раздел не найден!');
                return;
            }
            
            // Проверяем, есть ли у фото краткая справка
            const hasShortInfo = data.images.length > 0 && typeof data.images[0] === 'object' && data.images[0].shortInfo;
            
            let galleryHTML = '';
            for (let i = 0; i < data.images.length; i++) {
                const img = data.images[i];
                
                if (hasShortInfo && typeof img === 'object') {
                    // Фото с краткой справкой
                    let shortInfoHTML = '';
                    if (img.shortInfo) {
                        shortInfoHTML = '<div class="short-info"><p>' + img.shortInfo.replace(/\n/g, '<br>') + '</p></div>';
                    }
                    
                    galleryHTML += `
                        <div class="photo-item">
                            <img src="${img.src}" alt="${img.shortInfo || data.title}">
                            ${shortInfoHTML}
                        </div>
                    `;
                } else {
                    // Обычное фото
                    const src = typeof img === 'object' ? img.src : img;
                    galleryHTML += `
                        <div class="photo-item">
                            <img src="${src}" alt="${data.title}">
                        </div>
                    `;
                }
            }
            
            let shortInfoHTML = '';
            if (data.shortInfo && !hasShortInfo) {
                shortInfoHTML = '<div class="short-info"><p>' + data.shortInfo.replace(/\n/g, '<br>') + '</p></div>';
            }
            
            let bioHTML = '';
            if (data.bio && !hasShortInfo) {
                bioHTML = '<div class="bio-section"><h3>Биография:</h3><p class="bio-text">' + data.bio + '</p></div>';
            }
            
            const archiveHTML = `
                <div class="archive-popup">
                    <div class="popup-header">
                        <h2>${data.title}</h2>
                        <span class="year">${data.year}</span>
                        <button class="close-btn" onclick="closePopup()">×</button>
                    </div>
                    <p class="description">${data.description}</p>
                    ${shortInfoHTML}
                    ${bioHTML}
                    <div class="gallery">${galleryHTML}</div>
                </div>
            `;
            
            const popupContainer = document.createElement('div');
            popupContainer.className = 'archive-popup-container';
            popupContainer.innerHTML = archiveHTML;
            document.body.appendChild(popupContainer);
            addPopupStyles();
        }

        function goBack() {
            window.location.href = '../index.html';
        }

        function closePopup() {
            const popup = document.querySelector('.archive-popup-container');
            if (popup) popup.remove();
        }

        function addPopupStyles() {
            if (document.getElementById('popup-styles')) return;
            const styles = `
                <style id="popup-styles">
                    .archive-popup-container {
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background: rgba(0,0,0,0.9);
                        z-index: 10000;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        padding: 20px;
                    }
                    .archive-popup {
                        background: white;
                        border-radius: 20px;
                        padding: 25px;
                        max-width: 90vw;
                        max-height: 90vh;
                        overflow-y: auto;
                        color: #333;
                        border: 3px solid #b30000;
                    }
                    .popup-header {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        margin-bottom: 15px;
                        border-bottom: 2px solid #b30000;
                        padding-bottom: 15px;
                    }
                    .popup-header h2 {
                        margin: 0;
                        color: #333;
                        font-size: 1.4em;
                    }
                    .year {
                        background: #b30000;
                        color: white;
                        padding: 5px 15px;
                        border-radius: 20px;
                        font-weight: bold;
                    }
                    .close-btn {
                        background: none;
                        border: none;
                        font-size: 28px;
                        cursor: pointer;
                        color: #666;
                    }
                    .description {
                        color: #666;
                        font-style: italic;
                        margin-bottom: 25px;
                        line-height: 1.5;
                    }
                    .gallery {
                        display: grid;
                        gap: 20px;
                    }
                    .photo-item img {
                        width: 100%;
                        border-radius: 12px;
                        border: 2px solid #ddd;
                    }
                    .short-info {
                        margin: 15px 0;
                        padding: 12px;
                        background: #e8f4f8;
                        border-radius: 8px;
                        border-left: 3px solid #b30000;
                    }
                    .short-info p {
                        color: #333;
                        line-height: 1.5;
                        margin: 0;
                    }
                    .bio-section {
                        margin: 20px 0;
                        padding: 15px;
                        background: #f9f9f9;
                        border-radius: 10px;
                        border-left: 4px solid #b30000;
                    }
                    .bio-section h3 {
                        color: #b30000;
                        margin-bottom: 10px;
                        font-size: 1.1em;
                    }
                    .bio-text {
                        color: #444;
                        line-height: 1.6;
                        margin: 0;
                    }

                    @media (max-width: 768px) {
                        .short-info p {
                            font-size: 14px;
                        }
                        .archive-popup {
                            padding: 15px;
                        }
                        .popup-header h2 {
                            font-size: 1.2em;
                        }
                    }
                </style>
            `;
            document.head.insertAdjacentHTML('beforeend', styles);
        }
    </script>
</body>
</html>
