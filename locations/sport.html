<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спортивные достижения - Цифровой код кадетства</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(179, 0, 0, 0.9);
            border-radius: 15px;
            border: 2px solid #ff4444;
        }
        .menu-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(179, 0, 0, 0.5);
            border-radius: 12px;
            padding: 18px 20px;
            margin: 12px 0;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .menu-btn:hover {
            background: rgba(179, 0, 0, 0.3);
            border-color: #ff4444;
            transform: translateY(-2px);
        }
        .btn-icon {
            font-size: 24px;
            margin-right: 15px;
            width: 40px;
            text-align: center;
        }
        .btn-text {
            flex-grow: 1;
            text-align: left;
        }
        .btn-year {
            background: #b30000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .back-btn {
            display: block;
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #555;
            border-radius: 10px;
            padding: 15px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏆 Спортивные достижения</h1>
        <p>Гордость и победы наших кадетов</p>
    </div>

    <div class="menu-container">
        <button class="menu-btn" onclick="showArchive('sport-2023')">
            <span class="btn-icon">🥇</span>
            <span class="btn-text">Соревнования 2023</span>
            <span class="btn-year">2023</span>
        </button>

        <button class="menu-btn" onclick="showArchive('sport-2024')">
            <span class="btn-icon">🥈</span>
            <span class="btn-text">Соревнования 2024</span>
            <span class="btn-year">2024</span>
        </button>

        <button class="menu-btn" onclick="showArchive('sport-2025')">
            <span class="btn-icon">🥉</span>
            <span class="btn-text">Соревнования 2025</span>
            <span class="btn-year">2025</span>
        </button>

        <button class="menu-btn" onclick="showArchive('sport-champs')">
            <span class="btn-icon">🏆</span>
            <span class="btn-text">Наши чемпионы</span>
            <span class="btn-year">⭐</span>
        </button>
        
        <button class="back-btn" onclick="goBack()">
            ← Назад к выбору объекта
        </button>
    </div>

    <script>
        const archiveData = {
            'sport-2023': {
                title: 'Спортивные соревнования 2023 года',
                year: '2023',
                description: 'Участие и победы в городских и областных соревнованиях.',
                images: [
                    '../photos/sport-2023-1.jpg',
                    '../photos/sport-2023-2.jpg'
                ]
            },
            'sport-2024': {
                title: 'Спортивные соревнования 2024 года',
                year: '2024', 
                description: 'Новые рекорды и достижения наших кадетов.',
                images: [
                    '../photos/sport-2024-1.jpg',
                    '../photos/sport-2024-2.jpg'
                ]
            },
            'sport-2025': {
                title: 'Спортивные соревнования 2025 года',
                year: '2025',
                description: 'Планы и подготовка к новым спортивным вершинам.',
                images: [
                    '../photos/sport-2025-1.jpg',
                    '../photos/sport-2025-2.jpg'
                ]
            },
            'sport-champs': {
                title: 'Наши чемпионы',
                year: 'Гордость корпуса',
                description: 'Кадеты, прославившие наш корпус в спорте.',
                images: [
                    '../photos/champs-1.jpg',
                    '../photos/champs-2.jpg'
                ]
            }
        };

        function showArchive(archiveId) {
            const data = archiveData[archiveId];
            if (!data) {
                alert('Раздел не найден!');
                return;
            }
            const archiveHTML = `
                <div class="archive-popup">
                    <div class="popup-header">
                        <h2>${data.title}</h2>
                        <span class="year">${data.year}</span>
                        <button class="close-btn" onclick="closePopup()">×</button>
                    </div>
                    <p class="description">${data.description}</p>
                    <div class="gallery">
                        ${data.images.map(img => `
                            <div class="photo-item">
                                <img src="${img}" alt="${data.title}">
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            const popupContainer = document.createElement('div');
            popupContainer.className = 'archive-popup-container';
            popupContainer.innerHTML = archiveHTML;
            document.body.appendChild(popupContainer);
            addPopupStyles();
        }

        function goBack() {
            window.location.href = '../index.html';
        }

        function closePopup() {
            const popup = document.querySelector('.archive-popup-container');
            if (popup) popup.remove();
        }

        function addPopupStyles() {
            if (document.getElementById('popup-styles')) return;
            const styles = `
                <style id="popup-styles">
                    .archive-popup-container {
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background: rgba(0,0,0,0.9);
                        z-index: 10000;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        padding: 20px;
                    }
                    .archive-popup {
                        background: white;
                        border-radius: 20px;
                        padding: 25px;
                        max-width: 90vw;
                        max-height: 90vh;
                        overflow-y: auto;
                        color: #333;
                        border: 3px solid #b30000;
                    }
                    .popup-header {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        margin-bottom: 15px;
                        border-bottom: 2px solid #b30000;
                        padding-bottom: 15px;
                    }
                    .popup-header h2 {
                        margin: 0;
                        color: #333;
                        font-size: 1.4em;
                    }
                    .year {
                        background: #b30000;
                        color: white;
                        padding: 5px 15px;
                        border-radius: 20px;
                        font-weight: bold;
                    }
                    .close-btn {
                        background: none;
                        border: none;
                        font-size: 28px;
                        cursor: pointer;
                        color: #666;
                    }
                    .description {
                        color: #666;
                        font-style: italic;
                        margin-bottom: 25px;
                        line-height: 1.5;
                    }
                    .gallery {
                        display: grid;
                        gap: 20px;
                    }
                    .photo-item img {
                        width: 100%;
                        border-radius: 12px;
                        border: 2px solid #ddd;
                    }
                </style>
            `;
            document.head.insertAdjacentHTML('beforeend', styles);
        }
    </script>
</body>
</html>
