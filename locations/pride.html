
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наши достижения - Цифровой код кадетства</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(179, 0, 0, 0.9);
            border-radius: 15px;
            border: 2px solid #ff4444;
        }
        .menu-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(179, 0, 0, 0.5);
            border-radius: 12px;
            padding: 18px 20px;
            margin: 12px 0;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .menu-btn:hover {
            background: rgba(179, 0, 0, 0.3);
            border-color: #ff4444;
            transform: translateY(-2px);
        }
        .btn-icon {
            font-size: 24px;
            margin-right: 15px;
            width: 40px;
            text-align: center;
        }
        .btn-text {
            flex-grow: 1;
            text-align: left;
        }
        .btn-year {
            background: #b30000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .back-btn {
            display: block;
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #555;
            border-radius: 10px;
            padding: 15px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏆 Гордимся мы - гордится вся страна</h1>
        <p> Гордость корпуса</p>
    </div>

    <div class="menu-container">
        <button class="menu-btn" onclick="showArchive('pride-1')">
            <span class="btn-icon">🥇</span>
            <span class="btn-text">Гринчак Иван Андреевич</span>
            <span class="btn-year">Выпускник 2008 года</span>
        </button>

        <button class="menu-btn" onclick="showArchive('pride-2')">
            <span class="btn-icon">🥇</span>
            <span class="btn-text">Андреёнок Николай Сергеевич</span>
            <span class="btn-year">Выпускник 2008 года</span>
        </button>

        <button class="menu-btn" onclick="showArchive('pride-3')">
            <span class="btn-icon">🎖️</span>
            <span class="btn-text">Николаев Никита Игоревич</span>
            <span class="btn-year">Выпускник 2008 года</span>
        </button>

        <button class="menu-btn" onclick="showArchive('pride-4')">
            <span class="btn-icon">🎖️</span>
            <span class="btn-text">Поветкин Константин Евгеньевич</span>
            <span class="btn-year">Выпускник 2012 года</span>
        </button>
        
         <button class="menu-btn" onclick="showArchive('pride-5')">
            <span class="btn-icon">🥇</span>
            <span class="btn-text">Ложников Матвей Сергеевич</span>
            <span class="btn-year">Выпускник 2012 года</span>
        </button>
        
         <button class="menu-btn" onclick="showArchive('pride-6')">
            <span class="btn-icon">🥇</span>
            <span class="btn-text">Журо Станислав Андреевич</span>
            <span class="btn-year">Выпускник 2019 года</span>
        </button>
        
          <button class="menu-btn" onclick="showArchive('pride-7')">
            <span class="btn-icon">🥇</span>
            <span class="btn-text">Дмитриев Павел Николаевич</span>
            <span class="btn-year">Выпускник 2019 года</span>
        </button>

         <button class="menu-btn" onclick="showArchive('pride-8')">
            <span class="btn-icon">🥇</span>
            <span class="btn-text">Кузнецов Ярослав Александрович</span>
            <span class="btn-year">Выпускник 2019 года</span>
        </button>
        
        <button class="back-btn" onclick="goBack()">
            ← Назад к выбору объекта
        </button>
    </div>

    <script>
        const archiveData = {
            'pride-1': {
                title: 'Позывной "Учитель',
                year: 'Награды',
                description: '',
                images: [
                    '../photos/pride-1-1.jpg',
                    '../photos/pride-1-2.jpg'
                ]
            },
            'pride-2': {
                title: 'Учебные успехи',
                year: 'Олимпиады',
                description: '',
                images: [
                    '../photos/pride-2-1.jpg',
                    '../photos/pride-2-2.jpg'
                ]
            },
            'pride-3': {
                title: '',
                year: 'Победы',
                description: 'Участие и победы в смотрах строя, военно-спортивных играх и патриотических акциях.',
                images: [
                    '../photos/pride-3-1.jpg',
                    '../photos/pride-3-2.jpg'
                ]
            },
             'pride-4': {
                title: '',
                year: 'Олимпиады',
                description: 'Призовые места в олимпиадах, конкурсах и интеллектуальных соревнованиях.',
                images: [
                    '../photos/pride-2-1.jpg',
                    '../photos/pride-2-2.jpg'
                ]
            },
             'pride-5': {
                title: '',
                year: 'Олимпиады',
                description: '',
                images: [
                    '../photos/pride-2-1.jpg',
                    '../photos/pride-2-2.jpg'
                ]
            },
             'pride-6': {
                title: 'Учебные успехи',
                year: 'Олимпиады',
                description: '',
                images: [
                    '../photos/pride-2-1.jpg',
                    '../photos/pride-2-2.jpg'
                ]
            },
             'pride-7': {
                title: '',
                year: '',
                description: '',
                images: [
                    '../photos/pride-2-1.jpg',
                    '../photos/pride-2-2.jpg'
                ]
            },
            'pride-8': {
                title: '',
                year: 'Гордость',
                description: 'Наши выпускники, прославившие корпус и страну.',
                images: [
                    '../photos/pride-4-1.jpg',
                    '../photos/pride-4-2.jpg'
                ]
            }
        };

        // Функции (скопируйте из management.html или obshezhitie.html)
        function showArchive(archiveId) {
            const data = archiveData[archiveId];
            const archiveHTML = `
                <div class="archive-popup">
                    <div class="popup-header">
                        <h2>${data.title}</h2>
                        <span class="year">${data.year}</span>
                        <button class="close-btn" onclick="closePopup()">×</button>
                    </div>
                    <p class="description">${data.description}</p>
                    <div class="gallery">
                        ${data.images.map(img => `
                            <div class="photo-item">
                                <img src="${img}" alt="${data.title}">
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            const popupContainer = document.createElement('div');
            popupContainer.className = 'archive-popup-container';
            popupContainer.innerHTML = archiveHTML;
            document.body.appendChild(popupContainer);
            addPopupStyles();
        }

        function goBack() {
            window.location.href = '../index.html';
        }

        function closePopup() {
            const popup = document.querySelector('.archive-popup-container');
            if (popup) popup.remove();
        }

        function addPopupStyles() {
            if (document.getElementById('popup-styles')) return;
            const styles = `
                <style id="popup-styles">
                    .archive-popup-container {
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background: rgba(0,0,0,0.9);
                        z-index: 10000;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        padding: 20px;
                    }
                    .archive-popup {
                        background: white;
                        border-radius: 20px;
                        padding: 25px;
                        max-width: 90vw;
                        max-height: 90vh;
                        overflow-y: auto;
                        color: #333;
                        border: 3px solid #b30000;
                    }
                    .popup-header {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        margin-bottom: 15px;
                        border-bottom: 2px solid #b30000;
                        padding-bottom: 15px;
                    }
                    .popup-header h2 {
                        margin: 0;
                        color: #333;
                        font-size: 1.4em;
                    }
                    .year {
                        background: #b30000;
                        color: white;
                        padding: 5px 15px;
                        border-radius: 20px;
                        font-weight: bold;
                    }
                    .close-btn {
                        background: none;
                        border: none;
                        font-size: 28px;
                        cursor: pointer;
                        color: #666;
                    }
                    .description {
                        color: #666;
                        font-style: italic;
                        margin-bottom: 25px;
                        line-height: 1.5;
                    }
                    .gallery {
                        display: grid;
                        gap: 20px;
                    }
                    .photo-item img {
                        width: 100%;
                        border-radius: 12px;
                        border: 2px solid #ddd;
                    }
                </style>
            `;
            document.head.insertAdjacentHTML('beforeend', styles);
        }
    </script>
</body>
</html>
